[package]
name = "openworkmate-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-global-shortcut = "2"
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
serde_json = "1"
base64 = "0.22"

[profile.dev]
debug = 0
incremental = false
