<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地升级对话 · OpenWorkMate</title>
<style>
:root{color-scheme:dark;font:16px/1.65 system-ui,sans-serif;background:#0b1323;color:#e6eefb}*{box-sizing:border-box}body{max-width:880px;margin:auto;padding:6vh 20px}header small,.tag{color:#79ddd2;letter-spacing:.08em}h1{font-size:clamp(28px,5vw,42px);margin:6px 0}p,small{color:#b5c4d9}form,article{border:1px solid #31435c;border-radius:16px;padding:20px;background:#152237;margin:20px 0}label{font-weight:600}textarea{display:block;background:#0c1729;color:inherit;border:1px solid #445a74;border-radius:8px;padding:12px;width:100%;margin:10px 0;font:inherit;resize:vertical}button,a{color:#87e6da}button{background:#183347;border:1px solid #436578;padding:7px 14px;border-radius:8px;font:inherit;cursor:pointer}.primary{background:#82ddcf;color:#102b32;border:0;font-weight:650}a,code{overflow-wrap:anywhere}article h3{margin:4px 0}ol{padding-left:24px;white-space:pre-wrap;overflow-wrap:anywhere}article a,article button{margin-right:16px}#error{color:#ffb4a7}pre{white-space:pre-wrap;overflow-wrap:anywhere}

<header><small>OPENWORKMATE / LOCAL LAB</small><h1>本地升级对话</h1><p>描述改动，试用独立候选版本，再决定是否合并。这里不会修改正在运行的工作台。</p></header>
<form><label for="request">你想升级什么？</label><textarea id="request" maxlength="600" rows="3" placeholder="描述新工具的输入、操作和预期结果" required></textarea><button class="primary">提交给模型</button> <button type="button" id="sample">填入需求示例</button><p><small>模型编写员工端离线交互工具。提交时仅将需求、匹配到的旧工具源码及合成验收样例发送至 OpenAI。请勿输入密钥或业务资料。测试、预览和合并留在本机。</small></p></form>
<p id="error" role="alert"></p><h2>升级记录</h2><div id="jobs" aria-live="polite"></div>
<script type="module" src="/lab.js"></script></html>
